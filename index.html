<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Wali</title>

    <link rel="stylesheet" href="/css/class.css">
</head>
<body>

    <style>
        .nk {
    display: none;
    direction: rtl;
}
.fr {
    display: block;
    direction: ltr;
}
#tete_de_wali {
    background-color: greenyellow;
    height: 10vh;
    min-height: 3rem;
    width: 100%;
    margin: 0;
}
#nom_de_ferme, #langue {
    position: relative;
    display: inline-block; 
    margin: 0.5rem;
    padding: 0 0.5rem;
    vertical-align: top;
    height: 2rem;
    line-height: 2rem;
    border-bottom: 1px solid #aaa;
}
#nom_de_ferme a {
    text-decoration: none;
}
#langue p {
    margin: 0;
    padding: 0;
}
#langue ul {
    display: none;
    list-style: none;
    background-color: #fff;
    box-shadow: 0 0 0.5rem #ccc;
}
#langue li {
    border-bottom: 1px solid #aaa;
    padding: 0;
    margin: 0;
    text-align: center;
}

    </style>

    
    <style id="index_css"></style>
    <div class="page_head" id="accueil_head"></div>
    <div class="page_body" id="accueil_body"></div>
 
    <script>
        fetch("/css/index.css")
        .then(response => response.text())
        .then(html => {
            document.querySelector("#index_css").innerHTML = html;
        });
    </script>

    <script>
        fetch("/html/tete-de-wali.html")
        .then(response => response.text())
        .then(html => {
            document.querySelector("#accueil_head").innerHTML = html;
        
            changementDeLangue();
        });
    </script>

    <script>
        fetch("/html/corps-de-wali.html")
        .then(response => response.text())
        .then(html => {
            document.querySelector("#accueil_body").innerHTML = html;
        });
    </script>

    <script src="/jquery-3.3.1.js"></script>
    <script src="/js/fonctions.js"></script>
    <script src="/js/index.js"></script>
</body>
