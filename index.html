<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Wali</title>

    <link rel="stylesheet" href="/css/class.css">
</head>
<body>
    
    <style id="index_css"></style>
    <div class="page_head" id="accueil_head"></div>
    <div class="page_body" id="accueil_body"></div>
 
    <script>
        fetch("/css/index.css")
        .then(response => response.text())
        .then(html => {
            document.querySelector("#index_css").innerHTML = html;
        });
    </script>

    <script>
        fetch("/html/tete-de-wali.html")
        .then(response => response.text())
        .then(html => {
            document.querySelector("#accueil_head").innerHTML = html;
        
            changementDeLangue();
        });
    </script>

    <script>
        fetch("/html/corps-de-wali.html")
        .then(response => response.text())
        .then(html => {
            document.querySelector("#accueil_body").innerHTML = html;
        });
    </script>

    <script src="/jquery-3.3.1.js"></script>
    <script src="/js/fonctions.js"></script>
    <script src="/js/index.js"></script>
</body>
